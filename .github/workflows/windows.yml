name: Windows build and smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and packager
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Unit tests
        run: python -m unittest -v
      - name: Windows GUI smoke test
        run: python app.py --smoke-test
      - name: Build native Windows app
        run: python -m PyInstaller --noconfirm --clean --windowed --name LR-StudyPet --add-data "assets;assets" app.py
      - name: Check executable starts and features work
        shell: pwsh
        run: |
          Remove-Item smoke-result.json -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath "$PWD\dist\LR-StudyPet\LR-StudyPet.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Native app startup timed out' }
          if ($process.ExitCode -ne 0) { throw "Native app failed with exit code $($process.ExitCode)" }
          $result = Get-Content smoke-result.json -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw 'Smoke test failed' }
      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package\LR-StudyPet\bin -Force
          Copy-Item dist\LR-StudyPet package\LR-StudyPet\bin\LR-StudyPet -Recurse
          Copy-Item Start.cmd,README.md,README.en.md,LICENSE,THIRD_PARTY.md package\LR-StudyPet
          Copy-Item smoke-result.json,windows-preview.png package\LR-StudyPet
          Copy-Item third-party-licenses package\LR-StudyPet -Recurse
          Compress-Archive -Path package\LR-StudyPet -DestinationPath LR-StudyPet-Blue-v0.2.0-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LR-StudyPet-Windows
          path: |
            LR-StudyPet-Blue-v0.2.0-Windows-x64.zip
            smoke-result.json
            windows-preview.png
      - name: Publish tested beta release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v0.2.0 --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.2.0 --repo "${{ github.repository }}" --title "星梨 v0.2.0 · 蓝色互动学习桌宠" --notes-file RELEASE.md --prerelease --target "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload v0.2.0 LR-StudyPet-Blue-v0.2.0-Windows-x64.zip --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
